[project]
name = "trycrypt"
version = "0.1.0"
description = "Offline security auditor for Cryptomator vaults"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "duckdb>=0.10",
    "numpy>=1.26",
]

[project.scripts]
trycrypt = "trycrypt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
