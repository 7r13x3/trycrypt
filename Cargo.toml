[package]
name = "trycrypt_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "trycrypt_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
scrypt = { version = "0.11", default-features = false }
aes-kw = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
zeroize = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
